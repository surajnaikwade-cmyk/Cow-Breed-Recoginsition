<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Cow Breed Recognition</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<nav class="navbar py-2">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">Cow Vision</a>
        <div class="nav-theme-toggle">
                <div class="btn-group btn-group-sm theme-toggle" role="group" aria-label="Theme toggle">
                    <button type="button" class="btn btn-outline-secondary" data-theme="cool"><span class="theme-swatch sw-cool"></span> Cool</button>
                    <button type="button" class="btn btn-outline-secondary" data-theme="warm"><span class="theme-swatch sw-warm"></span> Warm</button>
                    <button type="button" class="btn btn-outline-secondary" data-theme="neutral"><span class="theme-swatch sw-neutral"></span> Neutral</button>
                </div>
                <div class="form-check form-switch ms-2">
                    <input class="form-check-input" type="checkbox" id="darkToggle">
                    <label class="form-check-label small text-muted" for="darkToggle">Dark</label>
                </div>
            </div>
    </div>
</nav>

<div class="min-vh-100 d-flex align-items-center justify-content-center bg-gradient">
    <div class="card shadow-sm upload-card">
        <div class="card-body text-center">
            <h2 class="card-title mb-3">Cow Vision</h2>
            <p class="text-muted mb-4">Upload a cow image and the model will predict the breed.</p>

            

            <form action="/predict" method="post" enctype="multipart/form-data" id="uploadForm">
                <div id="dropzone" class="mb-3 dropzone">
                    <div class="dropzone-inner">
                        <p class="mb-1">Drag & drop an image here</p>
                        <small class="text-muted">or click to browse</small>
                    </div>
                    <input class="form-control file-input" type="file" id="fileInput" name="file" accept="image/*" required>
                </div>

                <div class="mb-3">
                    <img id="preview" src="" alt="Preview" class="img-thumbnail d-none preview-sm">
                </div>

                <div class="d-flex justify-content-center gap-2">
                    <button type="submit" id="submitBtn" class="btn btn-primary">Predict Breed</button>
                    <button type="button" id="clearBtn" class="btn btn-outline-secondary">Clear</button>
                </div>
            </form>

            <!-- Overlay shown during prediction -->
            <div id="overlay" class="overlay d-none">
                <div class="spinner-border text-light" role="status" aria-hidden="true"></div>
                <div class="mt-2 text-light">Predicting… please wait</div>
            </div>

            <small class="text-muted d-block mt-3">Supported formats: JPG, PNG. Recommended size: square images.</small>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const fileInput = document.getElementById('fileInput');
    const preview = document.getElementById('preview');
    const clearBtn = document.getElementById('clearBtn');
    const dropzone = document.getElementById('dropzone');
    const uploadForm = document.getElementById('uploadForm');
    const overlay = document.getElementById('overlay');
    const submitBtn = document.getElementById('submitBtn');

    function showPreview(file){
        const url = URL.createObjectURL(file);
        preview.src = url;
        preview.classList.remove('d-none');
    }

    // File input change
    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        showPreview(file);
    });

    // Drag & drop events
    dropzone.addEventListener('click', () => fileInput.click());
    dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('dragover'); });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
    dropzone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropzone.classList.remove('dragover');
        const dt = e.dataTransfer;
        if (dt && dt.files && dt.files.length) {
            // assign dropped files to input
            fileInput.files = dt.files;
            showPreview(dt.files[0]);
        }
    });

    // Clear button
    clearBtn.addEventListener('click', () => {
        fileInput.value = '';
        preview.src = '';
        preview.classList.add('d-none');
    });

    // On submit, show overlay spinner to indicate prediction in progress
    uploadForm.addEventListener('submit', (e) => {
        // show overlay and disable inputs while request is in flight
        overlay.classList.remove('d-none');
        submitBtn.disabled = true;
        clearBtn.disabled = true;
    });

    // Theme toggle (persisted) - applies site-wide and to the form card
    const uploadCard = document.querySelector('.upload-card');
    const themeBtns = document.querySelectorAll('.theme-toggle button');
    function applyTheme(theme){
        // form card classes (backwards compatible)
        ['theme-cool','theme-warm','theme-neutral'].forEach(c=>uploadCard.classList.remove(c));
        uploadCard.classList.add('theme-'+theme);
        // site-wide class on documentElement
        ['cv-theme-cool','cv-theme-warm','cv-theme-neutral'].forEach(c=>document.documentElement.classList.remove(c));
        document.documentElement.classList.add('cv-theme-'+theme);
        localStorage.setItem('cv_theme', theme);
        // update all theme buttons active state
        document.querySelectorAll('.theme-toggle button').forEach(b=> b.classList.toggle('active', b.dataset.theme===theme));
    }
    themeBtns.forEach(btn => btn.addEventListener('click', ()=> applyTheme(btn.dataset.theme)));
    const savedTheme = localStorage.getItem('cv_theme') || 'cool';
    applyTheme(savedTheme);

    // Dark mode toggle
    const darkToggle = document.getElementById('darkToggle');
    function applyDarkMode(enabled){
        if(enabled){
            document.documentElement.classList.add('dark-mode');
        } else {
            document.documentElement.classList.remove('dark-mode');
        }
        localStorage.setItem('cv_dark', enabled ? '1' : '0');
        if(darkToggle) darkToggle.checked = enabled;
    }
    if(darkToggle){
        darkToggle.addEventListener('change', () => applyDarkMode(darkToggle.checked));
        const savedDark = localStorage.getItem('cv_dark') === '1';
        applyDarkMode(savedDark);
    }
</script>
</body>
</html>
