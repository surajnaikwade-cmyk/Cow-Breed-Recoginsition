<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign Up - Cow Vision</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(120deg, rgba(78,115,223,0.06) 0%, rgba(28,200,138,0.05) 50%, rgba(255,255,255,0.02) 100%), linear-gradient(135deg, #f0f6ff 0%, #f0fff5 100%);
            position: relative;
            overflow: hidden;
        }

        .auth-container::before {
            content: "";
            position: absolute;
            width: 420px;
            height: 420px;
            left: -120px;
            top: -140px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(60,80,200,0.52), rgba(60,80,200,0.28) 48%, rgba(60,80,200,0.10) 72%);
            filter: blur(20px);
            animation: floatA 10s ease-in-out infinite;
        }

        .auth-container::after {
            content: "";
            position: absolute;
            width: 520px;
            height: 520px;
            right: -160px;
            bottom: -180px;
            border-radius: 50%;
            background: radial-gradient(circle at 70% 70%, rgba(255,99,71,0.38), rgba(255,140,84,0.22) 45%, rgba(255,140,84,0.08) 72%);
            filter: blur(20px);
            animation: floatB 14s ease-in-out infinite;
        }

        @keyframes floatA {
            0% { transform: translateY(0) translateX(0); }
            50% { transform: translateY(18px) translateX(10px); }
            100% { transform: translateY(0) translateX(0); }
        }

        @keyframes floatB {
            0% { transform: translateY(0) translateX(0); }
            50% { transform: translateY(-20px) translateX(-8px); }
            100% { transform: translateY(0) translateX(0); }
        }

        .auth-card {
            width: 100%;
            max-width: 420px;
            border-radius: 12px;
            background: white;
            box-shadow: 0 10px 30px rgba(78,115,223,0.12);
            position: relative;
            z-index: 1;
        }

        .auth-card .card-body {
            background: linear-gradient(180deg, rgba(78,115,223,0.06), rgba(255,99,71,0.03));
            border: 1px solid rgba(78,115,223,0.08);
            padding: 2rem;
        }

        .auth-card h2 {
            color: #4e73df;
            font-weight: 700;
            margin-bottom: 1.5rem;
        }

        .auth-card .form-control {
            border-radius: 8px;
            border: 1px solid rgba(78,115,223,0.15);
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .auth-card .form-control:focus {
            border-color: #4e73df;
            box-shadow: 0 0 0 0.2rem rgba(78,115,223,0.15);
        }

        .auth-card .btn-primary {
            background: linear-gradient(90deg, #4e73df, #2e59d9);
            border: none;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            font-weight: 600;
            width: 100%;
            transition: all 0.3s ease;
        }

        .auth-card .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(46,89,217,0.25);
        }

        .auth-link {
            text-align: center;
            margin-top: 1.5rem;
        }

        .auth-link a {
            color: #4e73df;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .auth-link a:hover {
            color: #2e59d9;
            text-decoration: underline;
        }

        .alert {
            border-radius: 8px;
            border: 1px solid;
            position: relative;
            z-index: 1;
        }

        .navbar {
            background: linear-gradient(90deg, rgba(78,115,223,0.12), rgba(28,200,138,0.08));
            position: relative;
            z-index: 2;
        }
    </style>
</head>
<body>
<nav class="navbar py-2">
    <div class="container-fluid d-flex justify-content-between align-items-center">
        <a class="navbar-brand" href="/">Cow Vision</a>
        <div class="nav-theme-toggle d-flex align-items-center gap-2">
            <div class="btn-group btn-group-sm theme-toggle" role="group" aria-label="Theme toggle">
                <button type="button" class="btn btn-outline-secondary" data-theme="cool"><span class="theme-swatch sw-cool"></span> Cool</button>
                <button type="button" class="btn btn-outline-secondary" data-theme="warm"><span class="theme-swatch sw-warm"></span> Warm</button>
                <button type="button" class="btn btn-outline-secondary" data-theme="neutral"><span class="theme-swatch sw-neutral"></span> Neutral</button>
            </div>
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="darkToggle">
                <label class="form-check-label small text-muted" for="darkToggle">Dark</label>
            </div>
        </div>
    </div>
</nav>

<div class="auth-container">
    <div class="auth-card">
        <div class="card-body">
            <!-- Flash Messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ 'danger' if category == 'danger' else 'success' }} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <h2 class="text-center">Sign Up</h2>
            <p class="text-muted text-center mb-4">Create a new account to get started</p>

            <form method="POST" action="{{ url_for('signup') }}">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>

                <div class="mb-3">
                    <label for="confirm_password" class="form-label">Confirm Password</label>
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                </div>

                <button type="submit" class="btn btn-primary">Sign Up</button>
            </form>

            <div class="auth-link">
                Already have an account? <a href="{{ url_for('login') }}">Login here</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</body>
</html>
